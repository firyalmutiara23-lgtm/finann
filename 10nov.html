<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 450px;
            width: 100%;
            position: relative;
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .stickers {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        h1 {
            color: #ff4081;
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .highlight {
            color: #e91e63;
            font-size: 1.4rem;
            font-weight: bold;
            margin: 15px 0;
            display: block;
            background: #ffe082;
            padding: 8px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        p.message {
            color: #424242;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .interactive-btn {
            background: linear-gradient(45deg, #ff4081, #ff80ab);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 64, 129, 0.4);
            transition: all 0.2s ease;
        }

        .interactive-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.6);
        }

        .interactive-btn:active {
            transform: scale(0.98);
        }

        .floating-stickers {
            position: absolute;
            font-size: 2rem;
            user-select: none;
            pointer-events: none;
            animation: float 3s ease-in-out infinite alternate;
        }

        .sticker-1 { top: -20px; left: -10px; }
        .sticker-2 { top: -20px; right: -10px; }
        .sticker-3 { bottom: -15px; left: 10px; }
        .sticker-4 { bottom: -15px; right: 10px; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(10deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Stiker Pojok -->
        <div class="floating-stickers sticker-1">🎈</div>
        <div class="floating-stickers sticker-2">🎁</div>
        <div class="floating-stickers sticker-3">🥳</div>
        <div class="floating-stickers sticker-4">✨</div>

        <!-- Stiker Utama -->
        <div class="stickers">🎂 🍰 🎉 🎊</div>

        <!-- Ucapan Ultah -->
        <h1>Selamat Happy Birthdayyyyyyy!!!</h1>
        
        <span class="highlight">Cie cie kepala dua 😜🤪</span>
        
        <p class="message">
            Pokoknya doa ulang tahunnn!! 🤲✨<br>
            Semoga makin sukses, bahagia terus, dan semua keinginannya tercapai! 💖🥂
        </p>

        <!-- Tombol Kejutan Interaktif -->
        <button class="interactive-btn" onclick="celebrate()">Klik Buat Hujan Konfeti! 🎉</button>
    </div>

    <!-- Script Animasi Konfeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Efek konfeti otomatis saat halaman pertama kali dibuka
        window.onload = () => {
            celebrate();
        };

        function celebrate() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
